# On every push to main and every pull request: tests, known vulnerabilities in packages and unsafe code.
# The same checks as build.bat, without the exe and the installer.
# Actions are pinned to a commit (a tag can be moved); Dependabot keeps them up to date.
name: CI

on:
  push:
    branches: [main]
  pull_request:  # including Dependabot PRs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"  # lazy import (PEP 810)

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Packages (pinned versions, hashes checked)
        run: python -m pip install -q -r requirements.txt -r requirements-build.txt

      - name: Known vulnerabilities in packages (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-build.txt --require-hashes --disable-pip

      # bandit on Python 3.13 via uv (pyyaml has no wheel for 3.15); the script makes it read lazy imports too
      - name: Unsafe code (bandit)
        run: python tools/bandit_scan.py

      - name: Tests (warnings count as errors, see pytest.ini)
        run: python -m pytest -q
