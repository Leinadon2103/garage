# Weekly check for new versions (and security updates) of the pinned packages and GitHub Actions.
# Dependabot updates requirements*.in and regenerates requirements*.txt with pip-compile.
# Dependabot does not know Python 3.15 yet and reads the version from the header of requirements*.txt. So generate
# those files with 3.14 (same versions and hashes; CI tests everything on 3.15):
#   uvx --python 3.14 --from pip-tools pip-compile <options from the header> requirements.in
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
