[pytest]
testpaths = tests
# Every warning is an error: a DeprecationWarning is the early notice that an update is going to break something.
# An exception only for a warning from someone else's code, with the reason next to it.
filterwarnings =
    error
    # PyMuPDF uses typing.ByteString (removed in Python 3.17); the fix comes from PyMuPDF via Dependabot
    ignore:'typing\.ByteString':DeprecationWarning:pymupdf
