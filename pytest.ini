[pytest]
testpaths = tests
# Elke waarschuwing is een fout: een DeprecationWarning is de vroege melding dat een update iets gaat breken.
# Een uitzondering alleen voor een waarschuwing uit andermans code, met de reden erbij.
filterwarnings =
    error
    # PyMuPDF gebruikt typing.ByteString (verdwijnt in Python 3.17); de oplossing komt van PyMuPDF via Dependabot
    ignore:'typing\.ByteString':DeprecationWarning:pymupdf
